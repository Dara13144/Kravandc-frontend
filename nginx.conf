server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Dynamic API proxy to live Render backend with DNS resolver (prevents Nginx boot crashes)
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        set $backend_upstream "https://kravandc-backend.onrender.com";
        proxy_pass $backend_upstream/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host kravandc-backend.onrender.com;
        proxy_cache_bypass $http_upgrade;
    }
}
